{% extends "artprompt/base.html" %}

{% block content %}
<h2>{{ title }}</h2>

<form action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Загрузить</button>
</form>

{% if saved_path %}
    <p><strong>Файл успешно загружен:</strong> {{ saved_path }}</p>
{% endif %}
{% endblock %}
