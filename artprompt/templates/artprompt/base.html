{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ArtPrompt{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'artprompt/css/styles.css' %}?v=10">
</head>
<body>
    <header>
        <h1>ArtPrompt</h1>
        {% include "artprompt/includes/nav.html" %}

        <nav>
            {% if user.is_authenticated %}
                <span>Профиль: {{ user.username }}</span> |
                <a href="{% url 'users:logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'users:login' %}">Войти</a> |
                <a href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </nav>
        <hr>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <hr>
    <footer>
        <p>Учебный проект Django</p>
    </footer>
</body>
</html>
