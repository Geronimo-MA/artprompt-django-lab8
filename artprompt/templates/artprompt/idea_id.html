{% extends "artprompt/base.html" %}

{% block title %}{{ idea.title }}{% endblock %}

{% block content %}
    <h2>{{ idea.title }}</h2>
    <p><strong>ID:</strong> {{ idea.id }}</p>
    <p><strong>Slug:</strong> {{ idea.slug }}</p>
    <p><strong>Стиль:</strong> {{ idea.style }}</p>
    <p><strong>Статус:</strong> {{ idea.get_status_display }}</p>
    <p>{{ idea.content }}</p>
{% endblock %}
